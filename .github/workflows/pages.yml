name: Build e publica no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            form/package-lock.json
            painel/package-lock.json

      # ─── form/ ──────────────────────────────────────────────────────
      - name: Instalar dependências (form)
        working-directory: form
        run: npm ci

      - name: Build form
        working-directory: form
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          BASE_URL: /form/
        run: npm run build

      # ─── painel/ ────────────────────────────────────────────────────
      - name: Instalar dependências (painel)
        working-directory: painel
        run: npm ci

      - name: Build painel
        working-directory: painel
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          BASE_URL: /painel/
        run: npm run build

      # ─── Monta site estático combinado ─────────────────────────────
      # As páginas estáticas (landing, legislação, enquete e as propostas de
      # identidade) vivem em landing/ no repositório.
      - name: Montar diretório do Pages
        run: |
          mkdir -p site/form site/painel
          cp -r form/dist/* site/form/
          cp -r painel/dist/* site/painel/
          cp .github/og-image.png site/og-image.png
          cp landing/*.html landing/*.css landing/*.js site/
          cp -r landing/identidades site/identidades

      # A enquete é HTML estático (sem bundler): os valores públicos entram por
      # substituição de placeholder, e o enquete.js é EMBUTIDO no HTML.
      #
      # O script fica em arquivo separado no repositório (legível, versionável),
      # mas vai inline para o ar. Motivo: como subresource externo ele não
      # executava de forma confiável atrás de proxy corporativo — a requisição
      # ficava pendurada, sem onload nem onerror, e o formulário caía no submit
      # GET padrão, jogando nome e e-mail na query string. Inline, a página é
      # autossuficiente: se o HTML chegou, o comportamento chegou junto.
      #
      # A CSP continua sem 'unsafe-inline': autorizamos exatamente este script
      # pelo hash SHA-256, calculado aqui.
      - name: Injetar configuração e embutir o script da enquete
        env:
          API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::VITE_API_URL ausente — a enquete sobe em modo somente visualização."
          fi
          python3 - <<'PY'
          import base64, hashlib, os, pathlib

          alvo = pathlib.Path('site/enquete.html')
          html = alvo.read_text(encoding='utf-8')
          html = html.replace('__API_URL__', os.environ.get('API_URL', ''))

          js = pathlib.Path('site/enquete.js').read_text(encoding='utf-8')
          if '</script' in js.lower():
              raise SystemExit('enquete.js contém </script — não pode ir inline sem escapar')

          # o hash cobre exatamente o texto entre as tags
          digest = base64.b64encode(hashlib.sha256(js.encode('utf-8')).digest()).decode('ascii')
          marcador = '<script src="./enquete.js"></script>'
          if marcador not in html:
              raise SystemExit('marcador do script não encontrado em enquete.html')
          html = html.replace(marcador, '<script>' + js + '</script>')
          html = html.replace("script-src 'self'", "script-src 'self' 'sha256-" + digest + "'")

          alvo.write_text(html, encoding='utf-8')
          pathlib.Path('site/enquete.js').unlink()   # não é mais servido
          print('enquete.html: placeholders substituídos e script embutido')
          print('  sha256-' + digest)
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v4 em vez de v5: com a v5, dez deploys seguidos ficaram presos em
      # `deployment_in_progress` até o timeout, que então CANCELA o deployment
      # — o site nunca atualizava. O parâmetro `timeout` da v5 é aceito nos
      # inputs mas não é respeitado (o job aborta em ~10 min de qualquer jeito).
      # A v4 é a última linha estável antes dessa mudança.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
