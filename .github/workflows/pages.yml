name: Build e publica no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            form/package-lock.json
            painel/package-lock.json

      # ─── form/ ──────────────────────────────────────────────────────
      - name: Instalar dependências (form)
        working-directory: form
        run: npm ci

      - name: Build form
        working-directory: form
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          BASE_URL: /form/
        run: npm run build

      # ─── painel/ ────────────────────────────────────────────────────
      - name: Instalar dependências (painel)
        working-directory: painel
        run: npm ci

      - name: Build painel
        working-directory: painel
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          BASE_URL: /painel/
        run: npm run build

      # ─── Monta site estático combinado ─────────────────────────────
      # As páginas estáticas (landing, legislação, enquete e as propostas de
      # identidade) vivem em landing/ no repositório.
      - name: Montar diretório do Pages
        run: |
          mkdir -p site/form site/painel
          cp -r form/dist/* site/form/
          cp -r painel/dist/* site/painel/
          cp .github/og-image.png site/og-image.png
          cp landing/*.html landing/*.css landing/*.js site/
          cp -r landing/identidades site/identidades

      # A enquete é HTML estático (sem bundler), então os valores públicos
      # entram por substituição de placeholder em vez de import.meta.env.
      - name: Injetar configuração pública na enquete
        env:
          API_URL: ${{ secrets.VITE_API_URL }}
          RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$RECAPTCHA_SITE_KEY" ]; then
            echo "::warning::VITE_API_URL ou VITE_RECAPTCHA_SITE_KEY ausente — a enquete sobe em modo somente visualização."
          fi
          python3 - <<'PY'
          import os, pathlib
          alvo = pathlib.Path('site/enquete.html')
          html = alvo.read_text(encoding='utf-8')
          html = html.replace('__API_URL__', os.environ.get('API_URL', ''))
          html = html.replace('__RECAPTCHA_SITE_KEY__', os.environ.get('RECAPTCHA_SITE_KEY', ''))
          alvo.write_text(html, encoding='utf-8')
          print('enquete.html: placeholders substituídos')
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # O padrão de 10 min vinha estourando com o deployment ainda em
          # `deployment_in_progress` — o Pages aceita e processa, só devagar.
          # Ao expirar, a action CANCELA o deployment, então o site nunca
          # atualiza. 25 min dá margem sem deixar o job pendurado à toa.
          timeout: 1500000
