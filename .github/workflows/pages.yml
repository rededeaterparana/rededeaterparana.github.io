name: Build e publica no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            form/package-lock.json
            painel/package-lock.json

      # ─── form/ ──────────────────────────────────────────────────────
      - name: Instalar dependências (form)
        working-directory: form
        run: npm ci

      - name: Build form
        working-directory: form
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          BASE_URL: /form/
        run: npm run build

      # ─── painel/ ────────────────────────────────────────────────────
      - name: Instalar dependências (painel)
        working-directory: painel
        run: npm ci

      - name: Build painel
        working-directory: painel
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          BASE_URL: /painel/
        run: npm run build

      # ─── Monta site estático combinado ─────────────────────────────
      # As páginas estáticas (landing, legislação, enquete e as propostas de
      # identidade) vivem em landing/ no repositório.
      - name: Montar diretório do Pages
        run: |
          mkdir -p site/form site/painel
          cp -r form/dist/* site/form/
          cp -r painel/dist/* site/painel/
          cp .github/og-image.png site/og-image.png
          cp landing/*.html landing/*.css site/
          cp -r landing/identidades site/identidades

      # A enquete foi ENCERRADA em 24/08/2026: a página virou o resultado, um
      # HTML estático sem formulário, sem script e sem chamada ao backend. Por
      # isso não há mais o passo que substituía __API_URL__ e embutia o
      # enquete.js inline com hash na CSP — não existe mais script para embutir.
      # Se a enquete voltar, recupere esse passo no histórico deste arquivo.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v4 em vez de v5: com a v5, dez deploys seguidos ficaram presos em
      # `deployment_in_progress` até o timeout, que então CANCELA o deployment
      # — o site nunca atualizava. O parâmetro `timeout` da v5 é aceito nos
      # inputs mas não é respeitado (o job aborta em ~10 min de qualquer jeito).
      # A v4 é a última linha estável antes dessa mudança.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
